name: Godot Check

on:
  pull_request:
    branches:
      - main

jobs:
  godot-check:
    name: Check Godot Project
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Godot installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true

      - name: Godot Version prüfen
        run: godot --version

      - name: Projekt importieren
        run: godot --headless --path . --import

      - name: Projekt prüfen
        run: godot --headless --path . --check-only

      - name: Spiel starten
        run: godot --headless --path . --quit-after 10
